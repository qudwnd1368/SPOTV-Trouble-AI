name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVICE_NAME: spotv-trouble-ai
  REGION: asia-northeast3
  ADDITIONAL_ALLOWED_EMAILS: >-
    justjyh2@gmail.com;jinsil.kim84@gmail.com;yje92725@gmail.com;woohj2222@gmail.com;codec258016@gmail.com;xogus2331@naver.com;kaltosheewon@gmail.com;kkm94965@gmail.com;minjeongchu448@gmail.com;yunalim230@gmail.com;noyr24862@gmail.com;kimhanbyeol050604@gmail.com;jwlee0630@naver.com;sunguriii91@gmail.com;shinuy031220@gmail.com;lih08211111@gmail.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --update-env-vars "ADDITIONAL_ALLOWED_EMAILS=$ADDITIONAL_ALLOWED_EMAILS" \
            --allow-unauthenticated \
            --quiet
